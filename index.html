<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SinteMed — Tus informes médicos claros. Toda la consulta para hablar con tu médico.</title>
  <meta name="description" content="Prepara tus consultas médicas con calma en iPhone, iPad y Mac: escanea informes, sintetiza lo importante con IA 100 % local y entrégalo en una hoja A4, PDF o QR." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SinteMed — Clear Medical Summaries. 100% On-Device." />
  <meta property="og:description" content="Prepara tus informes médicos con IA 100 % local en iPhone, iPad y Mac y dedica toda la consulta a hablar con tu médico." />
  <meta property="og:image" content="media/story_04.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="media/icon.png" />
  <style>
    :root {
      --bg: #08121e;
      --bg-card: rgba(18, 33, 52, 0.78);
      --border: rgba(255, 255, 255, 0.11);
      --border-hi: rgba(125, 211, 252, 0.35);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #5eead4;
      --accent-blue: #38bdf8;
      --radius: 22px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      background:
        radial-gradient(960px 520px at 50% -90px, rgba(30, 58, 95, 0.65), transparent 70%),
        radial-gradient(680px 420px at 88% 18%, rgba(56, 189, 248, 0.14), transparent 70%),
        var(--bg);
      color: var(--text);
      line-height: 1.58;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      background: rgba(8, 18, 30, 0.82);
      border-bottom: 1px solid var(--border);
    }
    .nav {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 21px;
      letter-spacing: -0.02em;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .lang-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .lang-btn:hover, .lang-btn.active {
      background: rgba(94, 234, 212, 0.16);
      border-color: var(--accent);
      color: var(--text);
    }

    .hero {
      padding: 72px 0 56px;
      text-align: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border-hi);
      color: #bae6fd;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.12;
      letter-spacing: -0.03em;
      max-width: 920px;
      margin: 0 auto 22px;
    }
    .hero-sub {
      font-size: clamp(17px, 2.1vw, 21px);
      color: var(--muted);
      max-width: 790px;
      margin: 0 auto 34px;
    }
    .cta-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }
    .btn-primary, .btn-secondary {
      padding: 14px 26px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2dd4bf, #38bdf8);
      color: #06131f;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-primary:hover, .btn-secondary:hover { transform: translateY(-2px); }

    .video-stage {
      max-width: 980px;
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border-hi);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
      background: #0b1828;
    }
    .video-stage video, .video-stage img {
      width: 100%;
      display: block;
    }

    section { padding: 68px 0; }
    .section-title {
      text-align: center;
      font-size: clamp(26px, 3.5vw, 38px);
      letter-spacing: -0.02em;
      margin-bottom: 42px;
    }
    .story-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
      gap: 22px;
    }
    .story-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .story-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .story-body { padding: 22px; }
    .story-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .story-body h3 { font-size: 19px; margin-bottom: 8px; }
    .story-body p { font-size: 15px; color: var(--muted); }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .feat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
    }
    .feat-card h3 { font-size: 19px; margin-bottom: 10px; color: #e0f2fe; }
    .feat-card p { font-size: 15px; color: var(--muted); }

    .screens-grid {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 22px;
    }
    .screen-frame {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
    }
    .screen-frame img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .model-banner {
      margin-top: 52px;
      padding: 36px 32px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(20, 48, 72, 0.85), rgba(13, 31, 48, 0.92));
      border: 1px solid var(--border-hi);
      text-align: center;
    }
    .model-banner h3 {
      font-size: clamp(22px, 3vw, 30px);
      margin: 10px auto 12px;
      max-width: 780px;
      letter-spacing: -0.02em;
    }
    .model-banner p {
      font-size: 16px;
      color: var(--muted);
      max-width: 760px;
      margin: 0 auto;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 36px 0 52px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
    footer a { color: #7dd3fc; margin-left: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand">
        <img src="media/icon.png" alt="SinteMed Icon" />
        <span>SinteMed</span>
      </div>
      <div class="lang-bar" id="langBar"></div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="pill" data-i18n="badge"></div>
        <h1 data-i18n="heroTitle"></h1>
        <p class="hero-sub" data-i18n="heroSub"></p>
        <div class="cta-row">
          <a href="#story" class="btn-primary" data-i18n="ctaPrimary"></a>
          <a href="privacy.html" id="ctaPrivacyBtn" class="btn-secondary" data-i18n="ctaPrivacy"></a>
        </div>

        <div class="video-stage" id="promoStage">
          <video id="promoVideo" controls playsinline preload="metadata" poster="media/story_04.jpg" style="display:none;"></video>
          <img id="promoFallbackImg" src="media/story_04.jpg" alt="SinteMed medical conversation" />
        </div>
      </div>
    </section>

    <section id="story">
      <div class="container">
        <h2 class="section-title" data-i18n="storySectionTitle"></h2>
        <div class="story-grid">
          <article class="story-card">
            <img src="media/story_01.jpg" alt="Overwhelmed consultation folder" />
            <div class="story-body">
              <span class="story-tag" data-i18n="s1Tag"></span>
              <h3 data-i18n="s1Title"></h3>
              <p data-i18n="s1Body"></p>
            </div>
          </article>
          <article class="story-card">
            <img src="media/story_02.jpg" alt="Calm preparation at home" />
            <div class="story-body">
              <span class="story-tag" data-i18n="s2Tag"></span>
              <h3 data-i18n="s2Title"></h3>
              <p data-i18n="s2Body"></p>
            </div>
          </article>
          <article class="story-card">
            <img src="media/story_03.jpg" alt="One-page summary & QR handoff" />
            <div class="story-body">
              <span class="story-tag" data-i18n="s3Tag"></span>
              <h3 data-i18n="s3Title"></h3>
              <p data-i18n="s3Body"></p>
            </div>
          </article>
          <article class="story-card">
            <img src="media/story_04.jpg" alt="Real doctor-patient conversation" />
            <div class="story-body">
              <span class="story-tag" data-i18n="s4Tag"></span>
              <h3 data-i18n="s4Title"></h3>
              <p data-i18n="s4Body"></p>
            </div>
          </article>
        </div>
      </div>
    </section>

    <section id="features">
      <div class="container">
        <h2 class="section-title" data-i18n="featSectionTitle"></h2>
        <div class="features-grid">
          <div class="feat-card"><h3 data-i18n="f1Title"></h3><p data-i18n="f1Body"></p></div>
          <div class="feat-card"><h3 data-i18n="f2Title"></h3><p data-i18n="f2Body"></p></div>
          <div class="feat-card"><h3 data-i18n="f3Title"></h3><p data-i18n="f3Body"></p></div>
          <div class="feat-card"><h3 data-i18n="f4Title"></h3><p data-i18n="f4Body"></p></div>
        </div>

        <div class="screens-grid">
          <div class="screen-frame"><img src="media/app_review.png" alt="SinteMed Summary Review" /></div>
          <div class="screen-frame"><img src="media/app_pdf.png" alt="SinteMed A4 PDF Preview" /></div>
          <div class="screen-frame"><img src="media/app_qr.png" alt="SinteMed Ephemeral Local QR" /></div>
        </div>

        <div class="model-banner">
          <span class="story-tag" data-i18n="modelTag"></span>
          <h3 data-i18n="modelTitle"></h3>
          <p data-i18n="modelBody"></p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <span data-i18n="footerNote"></span>
      <a href="privacy.html" id="footerPrivacyLink" data-i18n="privacyLink"></a>
    </div>
  </footer>

  <script src="i18n_10lang.js"></script>
  <script>
    (function () {
      const langs = ["es", "en", "fr", "de", "it", "pt", "bg", "ru", "ro", "uk"];
      const bar = document.getElementById("langBar");
      const vid = document.getElementById("promoVideo");
      const fallback = document.getElementById("promoFallbackImg");

      function updateVideoSource(code) {
        const preferred = code === "es" ? "media/sintemed_promo_es.mp4" : "media/sintemed_promo_en.mp4";
        const candidates = [preferred, "media/sintemed_promo.mp4"];
        let idx = 0;

        function tryNext() {
          if (idx >= candidates.length) {
            vid.style.display = "none";
            fallback.style.display = "block";
            return;
          }
          const src = candidates[idx++];
          vid.onerror = tryNext;
          vid.onloadedmetadata = () => {
            vid.style.display = "block";
            fallback.style.display = "none";
          };
          if (vid.getAttribute("src") !== src) {
            vid.setAttribute("src", src);
            vid.load();
          }
        }
        tryNext();
      }

      function applyLang(code) {
        const dict = window.SINTEMED_I18N[code] || window.SINTEMED_I18N.es;
        document.documentElement.lang = code;
        document.title = dict.metaTitle;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (dict[key]) el.textContent = dict[key];
        });
        document.querySelectorAll(".lang-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.lang === code);
        });
        document.getElementById("ctaPrivacyBtn").href = "privacy.html?lang=" + code;
        document.getElementById("footerPrivacyLink").href = "privacy.html?lang=" + code;
        updateVideoSource(code);
        try { history.replaceState(null, "", "?lang=" + code); } catch (_) {}
      }

      langs.forEach((code) => {
        const btn = document.createElement("button");
        btn.className = "lang-btn";
        btn.dataset.lang = code;
        btn.textContent = code.toUpperCase() + " · " + window.SINTEMED_I18N[code].langName;
        btn.onclick = () => applyLang(code);
        bar.appendChild(btn);
      });

      const params = new URLSearchParams(window.location.search);
      const urlLang = (params.get("lang") || "").toLowerCase();
      const navLang = (navigator.language || "es").slice(0, 2).toLowerCase();
      const initial = langs.includes(urlLang) ? urlLang : (langs.includes(navLang) ? navLang : "es");
      applyLang(initial);
    })();
  </script>
</body>
</html>
