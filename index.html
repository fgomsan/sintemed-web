  <style>
    :root {
      --bg: #08121e;
      --bg-card: rgba(18, 33, 52, 0.80);
      --bg-warm: rgba(22, 45, 68, 0.84);
      --border: rgba(255, 255, 255, 0.11);
      --border-hi: rgba(94, 234, 212, 0.36);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --muted-soft: #94a3b8;
      --accent: #5eead4;
      --accent-blue: #38bdf8;
      --radius: 22px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      background:
        radial-gradient(960px 520px at 50% -90px, rgba(30, 58, 95, 0.65), transparent 70%),
        radial-gradient(680px 420px at 88% 18%, rgba(56, 189, 248, 0.14), transparent 70%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1140px; margin: 0 auto; padding: 0 22px; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      background: rgba(8, 18, 30, 0.85);
      border-bottom: 1px solid var(--border);
    }
    .nav {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }
    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--muted-soft);
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .lang-btn:hover, .lang-btn.active {
      background: rgba(94, 234, 212, 0.16);
      border-color: var(--accent);
      color: var(--text);
    }
    .lang-select {
      display: none;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(94, 234, 212, 0.14);
      border: 1px solid var(--border-hi);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-author-link {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.16s ease;
      white-space: nowrap;
    }
    .nav-author-link:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(94, 234, 212, 0.12);
    }
    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: 11px;
      background: linear-gradient(135deg, #2dd4bf, #38bdf8);
      color: #05131f;
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 18px rgba(45, 212, 191, 0.22);
    }
    .nav-cta:hover { transform: translateY(-1px); }

    @media (max-width: 1060px) {
      .lang-bar { display: none; }
      .lang-select { display: inline-block; max-width: 185px; }
    }
    @media (max-width: 640px) {
      .container { padding: 0 16px; }
      .brand img { width: 32px; height: 32px; border-radius: 8px; }
      .brand span { font-size: 17.5px; }
      .lang-select { padding: 7px 11px; font-size: 13px; max-width: 165px; }
      .nav-author-link { display: none; }
      .nav-cta { padding: 7px 11px; font-size: 12px; white-space: normal; text-align: center; line-height: 1.2; }
      .story-grid, .features-grid { grid-template-columns: 1fr; }
      .cta-row { flex-direction: column; align-items: stretch; }
      .cta-row .btn-primary, .cta-row .btn-secondary { width: 100%; }
    }

    .hero {
      padding: 64px 0 52px;
      text-align: center;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border-hi);
      color: #bae6fd;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 22px;
    }
    h1 {
      font-size: clamp(31px, 5vw, 54px);
      line-height: 1.12;
      letter-spacing: -0.03em;
      max-width: 920px;
      margin: 0 auto 20px;
    }
    .hero-sub {
      font-size: clamp(17px, 2.05vw, 20.5px);
      color: var(--muted);
      max-width: 800px;
      margin: 0 auto 30px;
    }
    .cta-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .btn-primary, .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 100%;
      text-align: center;
      line-height: 1.3;
      padding: 15px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #2dd4bf, #38bdf8);
      color: #05131f;
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.26);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
    }
    .btn-primary:hover, .btn-secondary:hover { transform: translateY(-2px); }
    .btn-primary svg, .nav-cta svg { flex-shrink: 0; }

    .verify-inline {
      display: inline-block;
      color: #7dd3fc;
      font-size: 14.5px;
      font-weight: 500;
      margin-bottom: 40px;
      border-bottom: 1px dashed rgba(125, 211, 252, 0.45);
      padding-bottom: 2px;
    }
    .verify-inline:hover { color: var(--accent); border-bottom-color: var(--accent); }

    .video-stage {
      max-width: 980px;
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border-hi);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
      background: #0b1828;
    }
    .video-stage video, .video-stage img {
      width: 100%;
      display: block;
    }

    section { padding: 60px 0; }
    .section-title {
      text-align: center;
      font-size: clamp(26px, 3.5vw, 38px);
      line-height: 1.18;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }
    .section-sub {
      text-align: center;
      color: var(--muted);
      font-size: clamp(16px, 1.8vw, 18px);
      max-width: 780px;
      margin: 0 auto 38px;
    }

    .story-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(248px, 1fr));
      gap: 20px;
      margin-top: 34px;
    }
    .story-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .story-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .story-body { padding: 22px; }
    .story-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .story-body h3 { font-size: 19px; line-height: 1.3; margin-bottom: 8px; }
    .story-body p { font-size: 15px; color: var(--muted); }

    .caregiver-card {
      margin-top: 36px;
      padding: clamp(26px, 4vw, 38px);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(22, 52, 74, 0.88), rgba(15, 33, 52, 0.94));
      border: 1px solid var(--border-hi);
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .caregiver-card h3 {
      font-size: clamp(21px, 2.7vw, 28px);
      line-height: 1.24;
      letter-spacing: -0.02em;
    }
    .caregiver-card p {
      font-size: 16.5px;
      color: var(--muted);
      max-width: 920px;
    }

    .showcase-grid {
      display: grid;
      grid-template-columns: 1.36fr 0.84fr;
      gap: 26px;
      align-items: start;
    }
    @media (max-width: 860px) {
      .showcase-grid { grid-template-columns: 1fr; }
    }
    .showcase-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-hi);
      border-radius: 24px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .paper-sheet-btn {
      display: block;
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      overflow: hidden;
      cursor: zoom-in;
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.5);
      transition: transform 0.18s ease;
    }
    .paper-sheet-btn:hover { transform: translateY(-2px); }
    .paper-sheet-btn img {
      width: 100%;
      height: auto;
      display: block;
    }
    .phone-frame-btn {
      display: block;
      max-width: 340px;
      margin: 0 auto;
      background: #0d1726;
      padding: 10px;
      border-radius: 34px;
      border: 2px solid rgba(148, 163, 184, 0.35);
      cursor: zoom-in;
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.52);
      transition: transform 0.18s ease;
    }
    .phone-frame-btn:hover { transform: translateY(-2px); }
    .phone-frame-btn img {
      width: 100%;
      height: auto;
      border-radius: 24px;
      display: block;
    }
    .showcase-caption {
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.52;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 34px;
    }
    .feat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feat-card h3 { font-size: 19px; line-height: 1.3; color: #e0f2fe; }
    .feat-card p { font-size: 15px; color: var(--muted); flex: 1; }
    .feat-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--accent);
    }
    .feat-link:hover { text-decoration: underline; }

    .model-banner {
      margin-top: 52px;
      padding: clamp(30px, 4.5vw, 44px) clamp(22px, 4vw, 38px);
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(20, 50, 76, 0.90), rgba(11, 28, 45, 0.96));
      border: 1px solid var(--border-hi);
      text-align: center;
    }
    .price-pills {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 10px 0 8px;
    }
    .price-chip {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(94, 234, 212, 0.16);
      border: 1px solid var(--border-hi);
      color: #f8fafc;
      font-weight: 700;
      font-size: 15px;
    }
    .model-banner h3 {
      font-size: clamp(22px, 3vw, 31px);
      line-height: 1.22;
      margin: 10px auto 14px;
      max-width: 800px;
      letter-spacing: -0.02em;
    }
    .model-banner p {
      font-size: 16.5px;
      color: var(--muted);
      max-width: 790px;
      margin: 0 auto 26px;
    }

    .author-card {
      background: linear-gradient(145deg, rgba(18, 36, 56, 0.90), rgba(11, 24, 40, 0.96));
      border: 1px solid var(--border-hi);
      border-radius: 26px;
      padding: clamp(26px, 4vw, 42px);
    }
    .author-role {
      font-size: 15px;
      font-weight: 600;
      color: #7dd3fc;
      margin: 6px 0 16px;
    }
    .author-bio {
      font-size: 16px;
      color: var(--muted);
      max-width: 920px;
      margin-bottom: 12px;
    }
    .author-groups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
      margin-top: 26px;
    }
    .author-group {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .author-group h4 {
      font-size: 13.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .author-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      transition: all 0.16s ease;
    }
    .author-link:hover {
      border-color: var(--accent);
      background: rgba(94, 234, 212, 0.11);
      transform: translateY(-1px);
    }
    .author-link-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .author-link-sub {
      font-size: 12.5px;
      color: var(--muted-soft);
      margin-top: 2px;
    }
    .author-link-arrow {
      color: var(--accent);
      font-weight: 700;
      flex-shrink: 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 36px 0 52px;
      color: var(--muted-soft);
      font-size: 14px;
      text-align: center;
    }
    footer a { color: #7dd3fc; margin-left: 10px; font-weight: 600; }
    footer a:hover { text-decoration: underline; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(4, 10, 18, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: min(1040px, 96vw);
      max-height: 92vh;
      width: auto;
      height: auto;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8);
    }
    .lightbox-close {
      position: fixed;
      top: 18px;
      right: 20px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #ffffff;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
  </style>
</head>

  <script src="i18n_10lang.js"></script>
  <script>
    (function () {
      // Pegar aquí la URL pública del App Store cuando Apple apruebe la versión 1.0:
      const APP_STORE_URL = "";

      const langs = ["es", "en", "fr", "de", "it", "pt", "bg", "ru", "ro", "uk"];
      const bar = document.getElementById("langBar");
      const select = document.getElementById("langSelect");
      const vid = document.getElementById("promoVideo");
      const fallback = document.getElementById("promoFallbackImg");

      function buildDownloadHref(dict) {
        if (APP_STORE_URL && APP_STORE_URL.trim().length > 0) {
          return APP_STORE_URL.trim();
        }
        const subj = encodeURIComponent(dict.ctaMailSubject || "SinteMed App Store");
        const body = encodeURIComponent(dict.ctaMailBody || "");
        return "mailto:contacto@sintemed.app?subject=" + subj + "&body=" + body;
      }

      function updateVideoSource(code) {
        const preferred = "media/sintemed_promo_" + code + ".mp4";
        const candidates = [preferred, "media/sintemed_promo_en.mp4", "media/sintemed_promo_es.mp4"];
        let idx = 0;

        function tryNext() {
          if (idx >= candidates.length) {
            vid.style.display = "none";
            fallback.style.display = "block";
            return;
          }
          const src = candidates[idx++];
          vid.onerror = tryNext;
          vid.onloadedmetadata = () => {
            vid.style.display = "block";
            fallback.style.display = "none";
          };
          if (vid.getAttribute("src") !== src) {
            vid.setAttribute("src", src);
            vid.load();
          }
        }
        tryNext();
      }

      function applyLang(code) {
        const dict = window.SINTEMED_I18N[code] || window.SINTEMED_I18N.es;
        document.documentElement.lang = code;
        document.title = dict.metaTitle;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (dict[key]) el.textContent = dict[key];
        });

        const isLive = Boolean(APP_STORE_URL && APP_STORE_URL.trim().length > 0);
        const ctaHref = buildDownloadHref(dict);
        const navLabel = isLive ? dict.navCtaLive : dict.navCtaPrelaunch;
        const mainLabel = isLive ? dict.ctaDownloadLive : dict.ctaDownloadPrelaunch;

        document.getElementById("navDownloadLabel").textContent = navLabel;
        document.getElementById("heroDownloadLabel").textContent = mainLabel;
        document.getElementById("bottomDownloadLabel").textContent = mainLabel;

        ["navDownloadBtn", "heroDownloadBtn", "bottomDownloadBtn"].forEach((id) => {
          const el = document.getElementById(id);
          el.href = ctaHref;
          if (isLive) {
            el.target = "_blank";
            el.rel = "noopener";
          } else {
            el.removeAttribute("target");
            el.removeAttribute("rel");
          }
        });

        document.querySelectorAll(".lang-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.lang === code);
        });
        if (select.value !== code) select.value = code;

        const verifyHref = "privacy.html?lang=" + code + "#verificacion";
        document.getElementById("heroVerifyLink").href = verifyHref;
        document.getElementById("featVerifyLink").href = verifyHref;
        document.getElementById("footerPrivacyLink").href = "privacy.html?lang=" + code;

        const auth = (window.SINTEMED_AUTHOR && (window.SINTEMED_AUTHOR[code] || window.SINTEMED_AUTHOR.es)) || null;
        if (auth) {
          document.getElementById("navAuthorLink").textContent = auth.navLabel;
          document.getElementById("authorTag").textContent = auth.tag;
          document.getElementById("authorRole").textContent = auth.role;
          document.getElementById("authorBio1").textContent = auth.bio1;
          document.getElementById("authorBio2").textContent = auth.bio2;

          const webMap = {
            es: { c: "es", lib: "biblioteca", mp: "" },
            fr: { c: "fr", lib: "bibliotheque", mp: "fr/" },
            de: { c: "de", lib: "bibliothek", mp: "de/" },
            it: { c: "it", lib: "videoteca", mp: "it/" },
            pt: { c: "pt", lib: "biblioteca-pt", mp: "pt/" }
          };
          const m = webMap[code] || { c: "en", lib: "library", mp: "en/" };
          const stSlug = code === "es" ? "historias" : "stories";
          const groups = [
            { h: auth.g1, items: [
              { t: auth.dr, s: "icua.es/dr-fernando-gomez-sancha", u: "https://icua.es/dr-fernando-gomez-sancha/" },
              { t: auth.icua, s: "icua.es", u: "https://icua.es/" }
            ]},
            { h: auth.g2, items: [
              { t: auth.bph, s: "holep.icua.es/" + m.c + ".html", u: "https://holep.icua.es/" + m.c + ".html" },
              { t: auth.cancer, s: "prostatectomia.icua.es/" + m.c + ".html", u: "https://prostatectomia.icua.es/" + m.c + ".html" },
              { t: auth.videos, s: "holep.icua.es/videos/" + m.c, u: "https://holep.icua.es/videos/" + m.c + "/" }
            ]},
            { h: auth.g3, items: [
              { t: auth.myprostate, s: "holep.icua.es/myprostate", u: "https://holep.icua.es/myprostate/" + m.mp },
              { t: auth.stories, s: "holep.icua.es/" + stSlug, u: "https://holep.icua.es/" + stSlug + "/" },
              { t: auth.library, s: "holep.icua.es/" + m.lib, u: "https://holep.icua.es/" + m.lib + "/" }
            ]},
            { h: auth.g5, items: [
              { t: "YouTube · @drgomezsancha", s: auth.ytSub, u: "https://www.youtube.com/@drgomezsancha" },
              { t: "LinkedIn · Dr. Fernando Gómez Sancha", s: "linkedin.com/in/drgomezsancha", u: "https://www.linkedin.com/in/drgomezsancha" },
              { t: "X · @fgomsan", s: "x.com/fgomsan", u: "https://x.com/fgomsan" },
              { t: "ORCID · 0000-0002-3640-7465", s: auth.orcidSub, u: "https://orcid.org/0000-0002-3640-7465" }
            ]}
          ];
          const container = document.getElementById("authorGroups");
          container.innerHTML = "";
          groups.forEach((g) => {
            const box = document.createElement("div");
            box.className = "author-group";
            const h4 = document.createElement("h4");
            h4.textContent = g.h;
            box.appendChild(h4);
            g.items.forEach((it) => {
              const a = document.createElement("a");
              a.className = "author-link";
              a.href = it.u;
              a.target = "_blank";
              a.rel = "noopener";
              const left = document.createElement("div");
              const title = document.createElement("div");
              title.className = "author-link-title";
              title.textContent = it.t;
              const sub = document.createElement("div");
              sub.className = "author-link-sub";
              sub.textContent = it.s;
              left.appendChild(title);
              left.appendChild(sub);
              const arr = document.createElement("span");
              arr.className = "author-link-arrow";
              arr.textContent = "↗";
              a.appendChild(left);
              a.appendChild(arr);
              box.appendChild(a);
            });
            container.appendChild(box);
          });
        }

        const pdfSrc = "media/pdf_sample_a4_" + code + ".png";
        const phoneSrc = "media/iphone_step7_review_" + code + ".png";
        const pdfBtn = document.getElementById("pdfShowcaseBtn");
        const pdfImg = document.getElementById("pdfShowcaseImg");
        if (pdfBtn && pdfImg) {
          pdfBtn.setAttribute("data-zoom-src", pdfSrc);
          if (dict.pdfZoomAria) pdfBtn.setAttribute("aria-label", dict.pdfZoomAria);
          pdfImg.setAttribute("src", pdfSrc);
          if (dict.pdfImgAlt) pdfImg.setAttribute("alt", dict.pdfImgAlt);
        }
        const phoneBtn = document.getElementById("phoneShowcaseBtn");
        const phoneImg = document.getElementById("phoneShowcaseImg");
        if (phoneBtn && phoneImg) {
          phoneBtn.setAttribute("data-zoom-src", phoneSrc);
          if (dict.phoneZoomAria) phoneBtn.setAttribute("aria-label", dict.phoneZoomAria);
          phoneImg.setAttribute("src", phoneSrc);
          if (dict.phoneImgAlt) phoneImg.setAttribute("alt", dict.phoneImgAlt);
        }

        updateVideoSource(code);
        try { history.replaceState(null, "", "?lang=" + code); } catch (_) {}
      }

      langs.forEach((code) => {
        const info = window.SINTEMED_I18N[code];
        const btn = document.createElement("button");
        btn.className = "lang-btn";
        btn.dataset.lang = code;
        btn.title = info.langName;
        btn.textContent = code.toUpperCase();
        btn.onclick = () => applyLang(code);
        bar.appendChild(btn);

        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = "🌐 " + code.toUpperCase() + " · " + info.langName;
        select.appendChild(opt);
      });
      select.onchange = (e) => applyLang(e.target.value);

      const lightbox = document.getElementById("imgLightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      document.querySelectorAll("[data-zoom-src]").forEach((btn) => {
        btn.addEventListener("click", () => {
          lightboxImg.src = btn.getAttribute("data-zoom-src");
          lightboxImg.alt = btn.getAttribute("aria-label") || "";
          lightbox.classList.add("open");
        });
      });
      function closeLightbox() {
        lightbox.classList.remove("open");
        lightboxImg.src = "";
      }
      lightbox.addEventListener("click", closeLightbox);
      document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && lightbox.classList.contains("open")) closeLightbox();
      });

      const params = new URLSearchParams(window.location.search);
      const urlLang = (params.get("lang") || "").toLowerCase();
      const navLang = (navigator.language || "es").slice(0, 2).toLowerCase();
      const initial = langs.includes(urlLang) ? urlLang : (langs.includes(navLang) ? navLang : "es");
      applyLang(initial);
    })();
  </script>
