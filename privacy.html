    .back-link { font-weight: 600; color: var(--link); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .lang-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .lang-pill {
      background: rgba(255,255,255,0.07); color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .lang-pill.active { background: #1560a8; border-color: var(--link); color: #fff; }
    h1 { font-size: clamp(24px, 3.6vw, 32px); line-height: 1.22; margin: 0 0 8px; }
    h2 { font-size: 20px; color: var(--link); margin: 28px 0 10px; }
    a { color: var(--link); }
    ul, ol { padding-left: 22px; }
    li { margin-bottom: 9px; }
    code {

      background: rgba(255, 255, 255, 0.09); padding: 2px 6px; border-radius: 6px;
    }
    .verify-box {
      margin: 24px 0; padding: 22px 24px; border-radius: 18px;
      background: var(--verify-bg); border: 1px solid var(--border-hi);
    }
    .verify-box h2 { margin-top: 0; color: var(--accent); }
    .meta-line { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .footer-note { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }

        document.title = d.title;
        document.getElementById("backLink").textContent = d.back;
        document.getElementById("backLink").href = "index.html?lang=" + encodeURIComponent(code);
        document.getElementById("supportLink").href = "soporte.html?lang=" + encodeURIComponent(code);
        document.getElementById("pTitle").textContent = d.title;
        document.getElementById("pUpdated").textContent = d.updated;
        document.getElementById("hController").textContent = d.hController;
        document.getElementById("pController").textContent = d.pController;
        document.getElementById("hVerify").textContent = d.hVerify;
        fillList("listVerify", d.verify);
        document.getElementById("hCollection").textContent = d.hCollection;
        fillList("listCollection", d.collection);
        document.getElementById("hRetention").textContent = d.hRetention;
        fillList("listRetention", d.retention);
        document.getElementById("hRights").textContent = d.hRights;
        fillList("listRights", d.rights);
        document.getElementById("hTech").textContent = d.hTech;
        fillList("listTech", d.tech);
        document.querySelectorAll(".lang-pill").forEach((b) => b.classList.toggle("active", b.dataset.lang === code));
      }

      codes.forEach((c) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "lang-pill";
        btn.dataset.lang = c;
        btn.textContent = c.toUpperCase();
        btn.addEventListener("click", () => {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", c);
          window.history.replaceState({}, "", url);
          render(c);
        });
        pills.appendChild(btn);
      });

      render(current);
    })();
  </script>
</body>
</html>
